# Configuration guide — live environment overrides for Alchemy-only leader detection.
# Options: mode is on_chain_logs_only | on_chain_pending | confirmed+mempool_reserved;
# max_hourly_ws_mb sets the rolling 1-hour WSS bandwidth circuit breaker threshold.
# Trade-offs: on_chain_logs_only streams server-side user-filtered OrderFilled logs at near-$0
# CU cost; confirmed+mempool_reserved / on_chain_pending lower latency with automatic downgrade
# to on_chain_logs_only if hourly WSS bandwidth exceeds PMCOPY__MAX_HOURLY_WS_MB.
mode: on_chain_logs_only
onchain:
  include_legacy_v1_exchanges: false
  track_direct_user_txs: false
  max_hourly_ws_mb: 250
  mempool_reservation_ttl_seconds: 15.0
  subscription_debounce_seconds: 2.0
  pending_tx_provider: alchemy
  pending_tx_hashes_only: false
  pending_tx_max_signal_age_ms: 700
  pending_tx_detection_confidence_required: pending_probable
  pending_copy_confirmation_enabled: true
  pending_copy_confirmation_deadline_seconds: 60
  pending_copy_confirmation_max_tracked: 2048
