# Configuration guide — Alchemy-only leader detection & WSS bandwidth cost controls.
# Options: mode is on_chain_logs_only | on_chain_pending | confirmed+mempool_reserved
# (alias on_chain_confirmed+mempool_reserved); booleans toggle V1 exchanges and direct txs.
# Trade-offs: on_chain_logs_only uses server-side user-filtered OrderFilled topics at near-$0
# CU cost; pending/mempool modes reduce latency at higher WSS bandwidth, capped by max_hourly_ws_mb.
# Set PMCOPY__ALCHEMY_WSS_URL in secrets.env (never commit provider API keys here).
mode: on_chain_logs_only
fetch_interval: 0.5
aggregate_signal_window_seconds: 1
leader_positions_min_fetch_spacing_ms: 250
leader_activity_min_fetch_spacing_ms: 250
trade_queue_max_batches: 64
onchain:
  alchemy_wss_url: ''
  include_legacy_v1_exchanges: false
  track_direct_user_txs: false
  max_hourly_ws_mb: 250
  mempool_reservation_ttl_seconds: 15.0
  subscription_debounce_seconds: 2.0
  pending_tx_hashes_only: false
  pending_tx_max_signal_age_ms: 500
  pending_tx_detection_confidence_required: pending_probable
  pending_copy_confirmation_enabled: false
  pending_copy_confirmation_deadline_seconds: 60.0
  pending_copy_confirmation_max_tracked: 2048
  pending_copy_auto_unwind_enabled: false
native:
  state_path: data/native_detection.sqlite3
  traders: []
  pending_enabled: false
  maximum_inclusions: 1000000
  recovery_maximum_gap: 5000
  recovery_overlap: 8
