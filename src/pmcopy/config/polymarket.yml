# Configuration guide — Polymarket network/account-data settings (Alchemy-only).
# Purpose: configure Polygon chain identity, collateral addresses, and geoblock safety;
# authenticated order writes go exclusively through ccxt.prediction.polymarket.
# Options: rpc_url and fallback_rpc_url accept empty string (auto-derived from
# PMCOPY__ALCHEMY_WSS_URL) or an Alchemy Polygon HTTPS URL; chain_id is 137 | 80002.
# Trade-offs: enforce_geoblock=true fails closed in restricted regions with an extra
# startup/order check; disabling it skips client-side geoblock probes.
rpc_url: ''
chain_id: 137
usdc_contract_address: '0xC011a7E12a19f7B1f670d46F03B03f3342E82DFB'
enforce_geoblock: true
fallback_rpc_url: ''
collateral_contract_address: ''
pusd_contract_address: '0xC011a7E12a19f7B1f670d46F03B03f3342E82DFB'
