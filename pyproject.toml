[project]
name = "polymarket-copy-trading-bot"
version = "1.0.1"
description = "Production-hardened Polymarket copy-trading bot with PostgreSQL persistence."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "python-dotenv==1.2.4",
  "aiohttp==3.14.5",
  "certifi>=2026.10.23",
  "httpx[http2]>=0.28.1,<1",
  "orjson>=3.11.0,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "uvloop>=0.22.0,<1; platform_system != 'Windows'",
  "web3==7.16.0",
  "eth-account==0.13.7",
  # CCXT prediction namespace is the only Polymarket venue transport.
  # Keep the exact behavior-verified release synchronized with install exports.
  "ccxt==4.5.92",
  "rich==14.3.4",
  "websockets>=13.0",
  "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.6,<8",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "testcontainers[postgres]>=4.0.0",
]

[project.scripts]
pmcopy = "pmcopy.bot_cli.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"pmcopy.storage.postgres" = ["migrations/*.sql"]
"pmcopy.telemetry_ui" = ["*.html", "*.css", "*.js"]
"pmcopy.config" = [
  "*.yml",
  "*.yaml",
  "traders/*.yml",
  "environments/*/*.yml",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pmcopy*"]
exclude = ["tests*", "legacy*"]
namespaces = false

[tool.pyright]
# LSP/type-check config: resolve imports against the project venv (Python 3.13).
# "basic" during the stabilization phase — the codebase has never been
# pyright-clean, and "standard" would flood LSP diagnostics with churn.
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
# Match the existing production-only mypy boundary. Test doubles are verified
# by pytest and intentionally excluded from static compatibility checks.
exclude = [".venv", "legacy", "tests", "build", "dist", "polymarket_copy_trading_bot.egg-info"]

[tool.ruff]
# Stabilization-phase config: formatting plus correctness-focused linting only.
# Style-opinion rule families are intentionally not enabled to avoid mass churn.
line-length = 100
target-version = "py313"
extend-exclude = [".venv", "polymarket_copy_trading_bot.egg-info"]

[tool.ruff.lint]
# E/W: pycodestyle errors/warnings, F: pyflakes, B: bugbear correctness,
# ASYNC: flake8-async (this is an asyncio-heavy codebase), PLE: pylint errors.
select = ["E", "F", "W", "B", "ASYNC", "PLE"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps to 100 where it can; E501 is only a backstop for lines
# the formatter cannot break (long literals), so it flags at 120.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use asserts, fixtures, and long literal lines.
"tests/**" = ["E501"]
# Operational scripts bootstrap sys.path/dotenv before imports (E402) and are
# allowed simple blocking pathlib IO in their one-shot async mains (ASYNC240).
"scripts/**" = ["E402", "ASYNC240"]

[tool.coverage.run]
source = ["src/pmcopy"]
branch = false

[tool.coverage.report]
# Aggregate core-only statement coverage floor (>= 60%).
# Uses coverage.py 7.x `**/pmcopy/...` patterns so unexecuted files discovered
# via `source = ["src/pmcopy"]` are included whether paths are relative or absolute.
fail_under = 60
precision = 2
show_missing = true
include = [
  "**/pmcopy/domain/*.py",
  "**/pmcopy/application/runtime_state.py",
  "**/pmcopy/application/trading_context.py",
  "**/pmcopy/application/copy_trade_service.py",
  "**/pmcopy/application/source_transaction_pipeline.py",
  "**/pmcopy/application/confirmed_signal_execution_adapter.py",
  "**/pmcopy/services/copyStrategy.py",
  "**/pmcopy/services/order_sizing.py",
  "**/pmcopy/services/copy_sizing_v5/domain.py",
  "**/pmcopy/services/copy_sizing_v5/policy.py",
  "**/pmcopy/services/copy_sizing_v5/strategies.py",
  "**/pmcopy/services/copy_sizing_v5/engine.py",
  "**/pmcopy/services/copyDecisionService.py",
  "**/pmcopy/services/leaderScoringService.py",
  "**/pmcopy/services/tradeScoringService.py",
  "**/pmcopy/services/idempotency.py",
  "**/pmcopy/services/balance_regime.py",
  "**/pmcopy/services/portfolio_valuation.py",
  "**/pmcopy/services/market_data_quality.py",
  "**/pmcopy/services/positionManager.py",
  "**/pmcopy/services/positionCoordinator.py",
  "**/pmcopy/services/positionActionCoordinator.py",
  "**/pmcopy/services/intentRegistry.py",
  "**/pmcopy/services/circuitBreaker.py",
  "**/pmcopy/services/entryPermissionService.py",
  "**/pmcopy/services/trading_permission.py",
  "**/pmcopy/services/trading_control.py",
  "**/pmcopy/services/leader_performance.py",
  "**/pmcopy/services/auto_trader.py",
  "**/pmcopy/services/auto_trader_performance.py",
  "**/pmcopy/services/paper_evaluation.py",
  "**/pmcopy/services/settlement.py",
  "**/pmcopy/services/market_readiness.py",
  "**/pmcopy/services/user_readiness.py",
  "**/pmcopy/services/executionService.py",
  "**/pmcopy/services/position_drift_service.py",
  "**/pmcopy/services/market_data_service.py",
  "**/pmcopy/services/execution/*.py",
  "**/pmcopy/services/risk/*.py",
  "**/pmcopy/services/copy_tasks/*.py",
  "**/pmcopy/services/discovery/bankroll_compatibility.py",
