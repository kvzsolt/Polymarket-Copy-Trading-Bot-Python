[project]
name = "polymarket-copy-trading-bot"
version = "0.1.0"
description = "Production-hardened Polymarket copy-trading bot with PostgreSQL persistence."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "python-dotenv==1.2.2",
  "aiohttp==3.14.1",
  "web3==7.15.0",
  "eth-account==0.13.7",
  "py-clob-client-v2==1.0.0",
  "rich==14.3.3",
  "websockets>=13.0",
  "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==0.24.0",
  "testcontainers[postgres]>=4.0.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
include = [
  "clients*",
  "config*",
  "interfaces*",
  "models*",
  "services*",
  "utils*",
  "domain*",
  "orchestrators*",
  "storage*",
]
exclude = ["tests*", "legacy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
