  "**/pmcopy/services/onchain_detection/pending_tx_detector.py",
  "**/pmcopy/services/onchain_detection/pending_transaction_factory.py",
  "**/pmcopy/services/onchain_detection/trade_detection_models.py",
  "**/pmcopy/services/onchain_detection/mempool_reservation_state.py",
  "**/pmcopy/services/onchain_detection/mined_fill_deduplicator.py",
  "**/pmcopy/services/onchain_detection/source_transaction_gate.py",
  "**/pmcopy/services/onchain_detection/leader_sell_fraction_resolver.py",
  "**/pmcopy/services/onchain_detection/leader_sell_scope_guard.py",
  "**/pmcopy/services/onchain_detection/pending_copy_confirmation_tracker.py",
]
