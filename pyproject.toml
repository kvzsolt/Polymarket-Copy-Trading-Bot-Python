  "**/pmcopy/services/discovery/cycle_summary.py",
  "**/pmcopy/services/discovery/discovery_models.py",
  "**/pmcopy/services/discovery/falcon_candidate_service.py",
  "**/pmcopy/services/discovery/falcon_discovery_service.py",
  "**/pmcopy/services/discovery/models.py",
  "**/pmcopy/services/discovery/policy_config.py",
  "**/pmcopy/services/discovery/ranking_report.py",
  "**/pmcopy/services/strategy_profile/strategy_classifier.py",
