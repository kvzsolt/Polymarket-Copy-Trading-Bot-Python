[project]
name = "polymarket-copy-trading-bot"
version = "0.1.0"
description = "Production-hardened Polymarket copy-trading bot with PostgreSQL persistence."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "python-dotenv==1.2.2",
  "aiohttp==3.14.1",
  "httpx[http2]>=0.28.1,<1",
  "orjson>=3.11.0,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "PyYAML>=6.0.2,<7",
  "uvloop>=0.22.0,<1; platform_system != 'Windows'",
  "web3==7.15.0",
  "eth-account==0.13.7",
  # Exact beta pin: the unified SDK is intentionally upgraded only after its
  # adapter contract suite and paper-trading soak pass.
  "polymarket-client==0.1.0b18",
  # CCXT prediction namespace: a mandatory runtime dependency, not an extra.
  # Range pin so patch releases are picked up but a breaking major (5.x) is
  # not installed without review.
  "ccxt>=4.5.70,<5",
  "rich==14.3.3",
  "websockets>=13.0",
  "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "testcontainers[postgres]>=4.0.0",
]

[project.scripts]
pmcopy = "bot_cli.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "bootstrap", "bot"]

[tool.setuptools.package-data]
config = ["*.yml", "*.yaml"]

[tool.setuptools.packages.find]
include = [
  "cache*",
  "clients*",
  "config*",
  "interfaces*",
  "models*",
  "services*",
  "utils*",
  "domain*",
  "orchestrators*",
  "storage*",
  "integrations*",
  "bot_cli*",
]
exclude = ["tests*", "legacy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
# Stabilization-phase config: formatting plus correctness-focused linting only.
# Style-opinion rule families are intentionally not enabled to avoid mass churn.
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "polymarket_copy_trading_bot.egg-info"]

[tool.ruff.lint]
# E/W: pycodestyle errors/warnings, F: pyflakes, B: bugbear correctness,
# ASYNC: flake8-async (this is an asyncio-heavy codebase), PLE: pylint errors.
select = ["E", "F", "W", "B", "ASYNC", "PLE"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use asserts, fixtures, and long literal lines.
"tests/**" = ["E501"]
