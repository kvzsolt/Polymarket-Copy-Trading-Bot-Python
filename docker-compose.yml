# Local dev stack for the Polymarket copy-trading bot.
#
# Usage:
#   docker compose up -d postgres                 # PG only (run bot via venv)
#   docker compose up                             # full stack — bot + PG
#
# Set POSTGRES_PASSWORD in a mode-0600 local secrets file or shell before
# starting the stack. There is deliberately no production default password.

services:
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      POSTGRES_DB: polymarket_copytrading_python
      # Keep WAL retained briefly so a crashed bot can replay; tune in prod.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Development-only host access; never expose PostgreSQL on 0.0.0.0.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d polymarket_copytrading_python"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bot:
    build: .
    container_name: polymarket-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - secrets.env
    environment:
      # Inside the compose network the bot reaches PG via the service name.
      DATABASE_URL: "postgresql://bot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/polymarket_copytrading_python"
      # TRADING_MODE comes from secrets.env and defaults to paper when absent.
      # Live mode also remains paused in PostgreSQL until an operator resumes it.
      ENABLE_METRICS_SERVER: "true"
      METRICS_PORT: "9102"
    ports:
      - "9102:9102"
    volumes:
      # Persist bot logs to the host so operator can tail them.
      - ./log:/app/log

volumes:
  postgres_data:
    name: polymarket_copytrading_python_postgres_data
