# Local dev stack for the Polymarket copy-trading bot.
#
# Usage:
#   docker compose up -d postgres  # PG only
#   docker compose up              # bot + PG
#
# Set POSTGRES_PASSWORD and PMCOPY__DATABASE__DSN in mode-0600 secrets.env (see
# secrets.env.example). Both services pick them up via env_file, so no
# --env-file flag is needed. There is deliberately no production default
# password; postgres itself refuses to start if POSTGRES_PASSWORD is unset.
#
# The bot service additionally bind-mounts config/runtime.local.yml, so run the
# documented setup first or compose refuses to start it:
#   cp config/runtime.local.example.yml config/runtime.local.yml

services:
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-bot-postgres
    restart: unless-stopped
    env_file:
      - secrets.env
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: polymarket_copytrading_python
      # Keep WAL retained briefly so a crashed bot can replay; tune in prod.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Development-only host access; never expose PostgreSQL on 0.0.0.0.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d polymarket_copytrading_python"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bot:
    build: .
    container_name: polymarket-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - secrets.env
    environment:
      # PMCOPY__DATABASE__DSN comes from secrets.env; inside
      # the compose network the bot reaches PG via the "postgres" service name,
      # e.g. postgresql://bot:<POSTGRES_PASSWORD>@postgres:5432/polymarket_copytrading_python
      # execution.trading_mode defaults to paper in config/runtime.yml.
      # Live mode also remains paused in PostgreSQL until an operator resumes it.
      PMCOPY__NETWORK__ENABLE_METRICS_SERVER: "true"
      PMCOPY__NETWORK__METRICS_PORT: "9102"
    ports:
      - "9102:9102"
    volumes:
      # config/runtime.local.yml is .dockerignore'd so local-only overrides
      # never bake into image layers, which means this mount is the only way
      # the documented `cp config/runtime.local.example.yml
      # config/runtime.local.yml` step reaches the container. Read-only: the
      # bot only ever reads it. create_host_path must stay false — the short
      # `./a:/b` syntax silently creates a *directory* when the source file is
      # missing, and AppConfig then dies on "Is a directory" instead of
      # naming the setup step the operator skipped.
      - type: bind
        source: ./config/runtime.local.yml
        target: /app/config/runtime.local.yml
        read_only: true
        bind:
          create_host_path: false
      # Persist bot logs to the host so operator can tail them.
      - ./log:/app/log

volumes:
  postgres_data:
    name: polymarket_copytrading_python_postgres_data
