# CCXT-only main branch stack. See docs/docker.md for setup and upgrades.
#
# Usage:
#   docker compose up -d postgres  # PG only
#   docker compose up --build -d   # bot + PG from the current checkout
#   docker compose run --rm bot doctor
#
# Secrets are split across two mode-0600 files, each read by exactly one
# service via env_file, so no --env-file flag is needed: db.env carries only
# POSTGRES_PASSWORD for the postgres service (see db.env.example), and
# secrets.env carries the bot's wallet key, DSN, discovery token, and relayer
# credentials (see secrets.env.example) — postgres never receives the bot's
# secret file, and the bot never receives the DB-only one. There is
# deliberately no production default password; postgres itself refuses to
# start if POSTGRES_PASSWORD is unset.
#
# The image is wheel-only (Task 20): the pmcopy package and its packaged
# config YAML tree install into site-packages, so no source tree is mounted
# and the image never reads files under /app/src. Runtime overrides use
# PMCOPY__* environment variables (secrets.env + the environment block
# below); changing packaged service YAML requires rebuilding the image.
# No deprecated runtime.local.yml setup file is required.

services:
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-bot-postgres
    restart: unless-stopped
    # DB-only credential file: POSTGRES_PASSWORD and nothing else.
    env_file:
      - db.env
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: polymarket_copytrading_python
      # Keep WAL retained briefly so a crashed bot can replay; tune in prod.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Development-only host access; never expose PostgreSQL on 0.0.0.0.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d polymarket_copytrading_python"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bot:
    image: polymarket-copy-trader:main
    build: .
    container_name: polymarket-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - secrets.env
    environment:
      # PMCOPY__DATABASE__DSN comes from secrets.env; inside
      # the compose network the bot reaches PG via the "postgres" service name,
      # e.g. postgresql://bot:<POSTGRES_PASSWORD>@postgres:5432/polymarket_copytrading_python
      # execution.trading_mode defaults to paper in config/execution.yml.
      # Live mode also remains paused in PostgreSQL until an operator resumes it.
      PMCOPY__APP__ENABLE_METRICS_SERVER: "true"
      PMCOPY__APP__METRICS_BIND_HOST: "0.0.0.0"
      PMCOPY__APP__METRICS_PORT: "9102"
    ports:
      - "127.0.0.1:9102:9102"
    stop_grace_period: 60s
    volumes:
      # New managed volumes inherit botuser ownership from the image, avoiding
      # root-owned host directories that make non-root startup fail.
      - bot_data:/app/data
      - bot_logs:/app/log

volumes:
  postgres_data:
    name: polymarket_copytrading_python_postgres_data
  bot_data:
  bot_logs:
