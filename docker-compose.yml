# CCXT-only main branch stack. See docs/docker.md for setup and upgrades.
#
# Usage:
#   docker compose up -d postgres  # PG only
#   docker compose up --build -d   # bot + PG from the current checkout
#   docker compose run --rm bot doctor
#
# Set POSTGRES_PASSWORD and PMCOPY__DATABASE__DSN in mode-0600 secrets.env (see
# secrets.env.example). Both services pick them up via env_file, so no
# --env-file flag is needed. There is deliberately no production default
# password; postgres itself refuses to start if POSTGRES_PASSWORD is unset.
#
# The current service YAML, environment overlays, and trader files are mounted
# read-only. No deprecated runtime.local.yml setup file is required.

services:
  postgres:
    image: postgres:16-alpine
    container_name: polymarket-bot-postgres
    restart: unless-stopped
    env_file:
      - secrets.env
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: polymarket_copytrading_python
      # Keep WAL retained briefly so a crashed bot can replay; tune in prod.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Development-only host access; never expose PostgreSQL on 0.0.0.0.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d polymarket_copytrading_python"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  bot:
    image: polymarket-copy-trader:main
    build: .
    container_name: polymarket-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - secrets.env
    environment:
      # PMCOPY__DATABASE__DSN comes from secrets.env; inside
      # the compose network the bot reaches PG via the "postgres" service name,
      # e.g. postgresql://bot:<POSTGRES_PASSWORD>@postgres:5432/polymarket_copytrading_python
      # execution.trading_mode defaults to paper in config/execution.yml.
      # Live mode also remains paused in PostgreSQL until an operator resumes it.
      PMCOPY__APP__ENABLE_METRICS_SERVER: "true"
      PMCOPY__APP__METRICS_BIND_HOST: "0.0.0.0"
      PMCOPY__APP__METRICS_PORT: "9102"
    ports:
      - "127.0.0.1:9102:9102"
    stop_grace_period: 60s
    volumes:
      # Keep this tree from the same checkout as the image: config includes
      # Python modules as well as YAML. Fail instead of creating a missing path.
      - type: bind
        source: ./config
        target: /app/config
        read_only: true
        bind:
          create_host_path: false
      # New managed volumes inherit botuser ownership from the image, avoiding
      # root-owned host directories that make non-root startup fail.
      - bot_data:/app/data
      - bot_logs:/app/log

volumes:
  postgres_data:
    name: polymarket_copytrading_python_postgres_data
  bot_data:
  bot_logs:
