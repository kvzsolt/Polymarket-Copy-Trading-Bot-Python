name: ci

on:
  push:
    branches: ["main", "develop", "develop-fix", "live-trading", "full-rework", "issue-*", "feat/*", "feature/hybrid-ccxt-implementation"]
  pull_request:
    branches: ["main", "develop", "develop-fix", "live-trading", "full-rework", "feature/hybrid-ccxt-implementation"]

permissions:
  contents: read

jobs:
  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        # Install from the generated lock export (requirements.txt) so CI
        # exercises exactly what uv.lock resolves; the editable install adds
        # the project itself without re-resolving anything, and pip check
        # blocks on an inconsistent environment.
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir --no-deps -e .
          pip check
      - name: no-xfail enforcement
        run: |
          if grep -rnE 'pytest\.mark\.xfail|pytest\.xfail' tests/; then
            echo "ERROR: xfail markers found — all tests must pass or be deleted"
            exit 1
          fi
      - name: config and discovery smoke
        # Parse the checked-in YAML layers, exercise dotenv/process precedence,
        # and validate the single discovery pipeline before the broad suite.
        run: pytest tests/test_config.py tests/discovery -q
      - name: pytest (unit tier)
        run: pytest -m "not integration and not release_gate" --maxfail=5 -q

  ccxt-runtime:
    # Mandatory-runtime integration matrix: the normal editable install pulls
    # CCXT from [project].dependencies. Keep the focused suite explicit so the
    # prediction adapter contract remains visible in CI.
    name: ccxt-runtime (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        # Install from the generated lock export (requirements.txt) so CI
        # exercises exactly what uv.lock resolves; the editable install adds
        # the project itself without re-resolving anything, and pip check
        # blocks on an inconsistent environment.
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir --no-deps -e .
          pip check
          python -c "import ccxt; print(f'ccxt {ccxt.__version__}')"
      - name: ccxt focused suite
        run: |
          pytest -q \
            tests/test_ccxt_precision.py \
            tests/test_ccxt_prediction_client.py \
            tests/test_ccxt_prediction_gateway_contract.py \
            tests/test_ccxt_prediction_gateway_errors.py \
            tests/test_ccxt_prediction_gateway_pagination.py \
            tests/test_ccxt_prediction_market_data.py \
            tests/test_ccxt_compat_tick_size.py \
            tests/test_ccxt_compat_credentials.py \
            tests/test_ccxt_compat_version_and_health.py \
            tests/test_paper_execution_gateway.py \
            tests/test_venue_runtime.py \
            tests/test_ccxt_optional_dependency.py
  release-gate:
    name: release-gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        # Install from the generated lock export (requirements.txt) so CI
        # exercises exactly what uv.lock resolves; the editable install adds
        # the project itself without re-resolving anything, and pip check
        # blocks on an inconsistent environment.
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir --no-deps -e .
          pip check
      - name: pytest (release-gate tier)
        run: pytest -m "release_gate" --maxfail=1 -q

  lint-type-import:
    name: lint-type-import (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        # Install from the generated lock export (requirements.txt) so CI
        # exercises exactly what uv.lock resolves; the editable install adds
        # the project itself without re-resolving anything, and pip check
        # blocks on an inconsistent environment.
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir --no-deps -e .
          pip check
      - name: compileall (syntax / import)
        run: python -m compileall -q .
      - name: requirements/pyproject drift check
        # Hard fail: uv.lock is the canonical resolution and both
        # requirements exports are generated from it. The script verifies the
        # exports match the lock exactly (name+version+marker), that pyproject
        # dependencies are locked, and that a fresh byte-identical export can
        # be rendered. The byte-exact comparison is uv-version-sensitive
        # (rendering/marker formatting changes between uv releases), so uv is
        # pinned here to the version that generated the committed exports;
        # bump the pin together with `python scripts/generate_requirements.py`.
        run: |
          pip install uv==0.11.31
          python scripts/check_requirements_drift.py
      - name: ruff (lint — hard fail on pyflakes + core pycodestyle)
        run: |
          pip install ruff
          # Hard-fail on pyflakes (F-class) and core pycodestyle (E-class) errors,
          # ignoring style-only categories that still have backlog: line-length (E501),
          # unused-import (F401), unused-var (F841), import-order (E402), ambiguous-name
          # (E741), and lambda-assignment (E731). Those land in the soft scan below
          # until cleanup batch.
          #
          # F821 (undefined name) was temporarily ignored on first ci-gate
          # landing; the 5 sites have all been fixed (riskMonitor legacy
          # loop block removed in Batch 4, scripts/find_followable_traders.py
          # imports added). Removed.
          ruff check --select=F,E --ignore=E501,F401,F841,E402,E741,E731 --exclude=legacy,test.py,bootstrap.py .
      - name: ruff (full scan — soft fail until lint debt cleared)
        continue-on-error: true
        run: ruff check --exclude=legacy,test.py,bootstrap.py .
      - name: bandit (security — hard fail medium+ severity)
        run: |
          pip install bandit
          # Skips (each tracked to a fix batch — remove the skip when that batch lands):
          #   B101 — assert (acceptable in tests; prod asserts replaced in Batch 11)
          #   B311 — random module (used only for retry jitter, never crypto)
          #   B608 — hardcoded SQL strings (Batch 8 quotes identifiers + replaces
          #          f-string SET builders)
          #   B108 — hardcoded /tmp path in config/db.py disabled-DB fallback
          #          (Batch 7 removes module-level constants)
          #   B310 — urlopen with Request — Polymarket API URLs are curated, not
          #          user-supplied; revisit if external URL ever flows here
          # B104 dropped — orphan services/observability/health_server.py
          # was deleted in Batch 9 logging hygiene work.
          bandit -r services orchestrators clients config utils cache storage interfaces domain integrations bot_cli app.py bootstrap.py -ll --skip B101,B311,B608,B108,B310
      - name: mypy (money-path spine — BLOCKING, no regressions allowed)
        run: |
          pip install mypy
          # Scoped, BLOCKING type-check of the order-signing + HTTP-transport
          # spine. These files must stay mypy-clean: a new type error here can
          # mis-sign an order (condition_id / neg-risk routing) or mishandle a
          # venue error. ``--follow-imports=silent``
          # restricts reporting to exactly these files; their transitive type
          # debt stays under the soft-fail step below. Expand this allowlist as
          # more money-path modules are cleaned. No ``|| true`` — this gates.
          mypy --install-types --non-interactive --explicit-package-bases \
            --ignore-missing-imports --follow-imports=silent \
            integrations/polymarket/ccxt_prediction_client.py \
            integrations/polymarket/ccxt_prediction_gateway.py \
            integrations/polymarket/venue_runtime.py \
            clients/network/http_client.py
      - name: mypy (type — soft fail until type debt cleared)
        continue-on-error: true
        run: |
          pip install mypy
          mypy --install-types --non-interactive --ignore-missing-imports services orchestrators domain || true

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (secrets.env + db.env)
        run: |
          install -m 600 secrets.env.example secrets.env
          install -m 600 db.env.example db.env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" db.env
          test "$(stat -c '%a' secrets.env)" = "600"
          test "$(stat -c '%a' db.env)" = "600"
          env -u POSTGRES_PASSWORD docker compose --env-file secrets.env config >/dev/null
      - name: docker build
        run: docker build -t polymarket-copy-trader:ci .
      - name: docker CLI smoke (offline)
        run: |
          docker run --rm --network none polymarket-copy-trader:ci --help
          docker run --rm --network none polymarket-copy-trader:ci run --help
          docker run --rm --network none polymarket-copy-trader:ci doctor --help
      - name: start PostgreSQL
        run: |
          docker network create pmct-smoke-net
          docker run -d --name pmct-postgres --network pmct-smoke-net \
            -e POSTGRES_USER=bot \
            -e POSTGRES_PASSWORD=paper-smoke-only \
            -e POSTGRES_DB=polymarket_copytrading_python \
            --health-cmd='pg_isready -U bot -d polymarket_copytrading_python' \
            --health-interval=2s --health-timeout=2s --health-retries=20 \
            postgres:16-alpine
          for _ in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' pmct-postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs pmct-postgres
          exit 1
      - name: docker run (paper mode)
        run: |
          docker run -d --name pmct-smoke --network pmct-smoke-net \
            -e PMCOPY__EXECUTION__TRADING_MODE=paper \
            -e PMCOPY__DATABASE__DSN=postgresql://bot:paper-smoke-only@pmct-postgres:5432/polymarket_copytrading_python \
            -e PMCOPY__WALLET__FUNDER_ADDRESS=0x0000000000000000000000000000000000000001 \
            -e PMCOPY__WALLET__POLYGON_RPC_URL=https://polygon-bor-rpc.publicnode.com \
            -e PMCOPY__NETWORK__RPC_URL=https://polygon-bor-rpc.publicnode.com \
            -e 'PMCOPY__LEADER__WALLETS=["0x0000000000000000000000000000000000000002"]' \
            -e PMCOPY__DISCOVERY__SCHEDULER__ENABLED=false \
            -e PMCOPY__APP__ENABLE_METRICS_SERVER=true \
            -e PMCOPY__APP__METRICS_BIND_HOST=0.0.0.0 \
            -e PMCOPY__APP__METRICS_PORT=9102 \
            --health-cmd='python -c "import json, urllib.request; payload = json.load(urllib.request.urlopen(\"http://localhost:9102/health\", timeout=3)); raise SystemExit(0 if payload.get(\"ok\") else 1)"' \
            --health-interval=2s --health-timeout=5s --health-retries=30 \
            -p 9102:9102 \
            polymarket-copy-trader:ci
      - name: container readiness probe
        run: |
          # The production image deliberately checks strict /health/ready,
          # which requires live venue WSS and executable market data. This
          # hermetic paper smoke uses fake wallets, so docker run overrides
          # the probe with /health and verifies its db_ok + api_ok payload.
          # Still require Docker's real health state instead of treating a
          # merely-running process as a successful startup.
          sleep 5
          for i in $(seq 1 12); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' pmct-smoke 2>/dev/null)" = "healthy" ]; then
              echo "container healthy (attempt $i)"
              exit 0
            fi
            sleep 5
          done
          echo "container failed to become healthy"
          docker logs pmct-smoke || true
          exit 1
      - name: cleanup
        if: always()
        run: |
          docker logs pmct-smoke || true
          docker stop pmct-smoke || true
          docker rm pmct-smoke || true
          docker logs pmct-postgres || true
          docker stop pmct-postgres || true
          docker rm pmct-postgres || true
          docker network rm pmct-smoke-net || true
