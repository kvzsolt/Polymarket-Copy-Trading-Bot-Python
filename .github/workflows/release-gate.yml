name: release-gate

on:
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (release-gate suite)
        run: pytest -m "release_gate" --maxfail=1 -q
      - name: gate result
        run: echo "release-gate passed — live trading remains operator-gated per CLAUDE.md"
