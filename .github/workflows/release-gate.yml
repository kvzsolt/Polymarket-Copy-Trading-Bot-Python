name: release-gate

on:
  release:
    types: [created, published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: release-gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: install
        # Install from the generated lock export (requirements.txt) so the
        # release tier exercises exactly what uv.lock resolves — not a fresh
        # re-resolution of the pyproject ranges. The editable install adds the
        # project itself without re-resolving anything, and pip check blocks
        # on an inconsistent environment before the gate suite runs.
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir --no-deps -e .
          pip check
      - name: pytest (release-gate suite)
        run: pytest -m "release_gate" --maxfail=1 -q
      - name: gate result
        run: echo "release-gate passed — live trading remains operator-gated per CLAUDE.md"
