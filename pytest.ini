[pytest]
addopts = -m "not integration and not release_gate"
testpaths = tests
pythonpath = src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # web3 7.x (verified through 7.16.0) unconditionally imports websockets.legacy (providers/legacy_websocket.py);
    # websockets >=14 deprecates that package. Unfixable at this repo's level until web3
    # drops the legacy provider. Targeted by exact message; everything else still surfaces.
    ignore:websockets.legacy is deprecated.*:DeprecationWarning
markers =
    integration: tests that require live external infrastructure (network, real DB, RPC)
    release_gate: release-blocker tests that must all pass before live trading is enabled (issue #75)
