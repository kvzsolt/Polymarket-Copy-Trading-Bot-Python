# Configuration guide: persist informational Alchemy and Infura usage estimates.
# Options: configure the ledger path, billing day, and initial usage estimates.
# Historical quota, reserve, rate-limit, and approval fields are accepted but inert.
# Trade-offs: counters do not restrict calls; provider-side plan limits still apply.
ledger_path: data/provider-budget.sqlite3
limits:
  alchemy_billing_day: 1
