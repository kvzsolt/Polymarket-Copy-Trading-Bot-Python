# Execution service settings. trading_mode is the single authoritative
# live/paper selector. CCXT is the only Polymarket venue transport.
# kill_switch here refuses BUY entries but still allows protective exits;
# the global master stop is app.yml kill_switch.
kill_switch: false
sell_fraction_missing_policy: skip
slippage_tolerance: 2.0
min_share_price: 0.10
max_share_price: 0.90
# Copy-entry band around the leader fill price (percent). 0 disables it.
max_entry_price_drift_pct: 5.0
non_terminal_failure_max_attempts: 3
trading_mode: paper
enable_copy_decision_gate: false
enable_near_resolution_gate: false
near_resolution_gate_price: 0.95
near_resolution_max_age_seconds: 15.0
pending_submission_ttl_seconds: 120
reservation_ttl_seconds: 120
reservations_enabled: false
book_spread_mode: absolute_bps
max_book_spread_bps: 2500
max_book_spread_ticks: 0
circuit_failure_threshold: 15
# In-memory belt behind the account-cap policy (350 pUSD moderate
# profile). 20.0 is the 17.5 per-copy cap plus rounding slack; 140.0 is
# the 40 % reserve as a free-cash floor. max_daily_spend_usdc stays 0
# (disabled): it measures gross submitted spend, so any non-zero value
# would starve re-entries after a normal day of round trips.
max_position_size_usdc: 20.0
max_daily_spend_usdc: 0.0
min_balance_headroom_usdc: 140.0
min_book_depth_usdc: 0.0
book_depth_band_pct: 5.0
execution_submit_concurrency: 4
trade_analysis_concurrency: 6
reconcile_concurrency: 4
copy_fak_max_attempts: 8
exit_fak_max_attempts: 8
