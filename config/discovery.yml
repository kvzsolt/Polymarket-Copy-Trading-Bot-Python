# Trader discovery (Falcon analytics, scoring, and scheduler).
# The shortlist/wallet360/recency/market/social/scoring/longitudinal/
# hysteresis/falcon sections feed discovery_config_hash: changing any
# of these values invalidates the persisted candidate roster (one-time
# rebuild). Values are migrated verbatim from trader_discovery.yaml so
# the roster hash is stable across the config split.
api:
  base_url: https://narrative.agent.heisenberg.so/api/v2/semantic/retrieve/parameterized
  token: ''
  timeout_seconds: 20.0
  max_retries: 6
  requests_per_second: 1.0
  burst: 1.0
  max_connections: 32
  max_keepalive_connections: 16
  keepalive_expiry_seconds: 30.0
  retry_base_delay_seconds: 1.0
  retry_max_delay_seconds: 30.0
  retry_jitter_ratio: 0.5
shortlist:
  min_win_rate_15d: 0.45
  max_win_rate_15d: 0.92
  min_roi_15d: 0.0
  min_pnl_15d: 100.0
  min_total_trades_15d: 30
  max_total_trades_15d: 5000
  sort_modes:
  - h_score
  - roi
  - win_rate
  - pnl
  page_size: 100
  max_pages: 5
  candidate_pool_size: 250
wallet360:
  windows:
  - '1'
  - '3'
  - '7'
  - '15'
  max_drawdown_pct: 35.0
  min_market_diversity: 3
  reject_bot_flagged: true
  max_stake_cv: 3.2
  min_win_rate_consistency: 0.6
recency:
  max_hours_since_last_trade: 48
  min_trades_lookback: 3
  lookback_hours: 168
  page_size: 100
  max_pages: 5
market:
  min_volume_24h: 5000.0
  min_liquidity_percentile: 40.0
  volume_trend: ALL
  max_top1_wallet_pct: 60.0
  min_unique_traders_7d: 25
  min_pass_ratio: 0.6
  max_markets_per_candidate: 8
social:
  enabled: false
  keywords: []
  hours_back: 24
  min_acceleration: 1.0
  min_author_diversity_pct: 20.0
scoring:
  weights:
    falcon_quality: 0.3
    copyability: 0.25
    recent_consistency: 0.15
    market_quality: 0.1
    volume_fit: 0.1
    rank_quality: 0.05
    risk_inverse: 0.05
  quality_weights:
    h_score: 0.5
    roi: 0.2
    win_rate: 0.15
    sharpe: 0.1
    baseline: 0.05
  runtime_weights:
    roster_score: 0.7
    win_rate: 0.15
    pnl: 0.1
    activity: 0.05
  h_score_range:
  - 0.0
  - 100.0
  roi_15d_range:
  - -50.0
  - 200.0
  win_rate_15d_range:
  - 0.35
  - 0.75
  sharpe_15d_range:
  - -1.0
  - 5.0
  volume_target_15d: 50000.0
  rank_target: 100
  copyability_trade_target: 50
  risk_drawdown_max_pct: 100.0
  runtime_default_roster_score: 0.5
  runtime_pnl_target_usdc: 100.0
  runtime_activity_target: 8
  runtime_score_floor: 0.1
longitudinal:
  enabled: true
  half_life_days: 7.0
  prior_score: 0.5
  shrinkage_trade_count: 30
  history_days: 90
  pnl_backfill_days: 180
  weights:
    sharpe: 0.3
    roi_slope: 0.2
    win_rate_stability: 0.2
    rank_trajectory: 0.15
    drawdown: 0.15
  sharpe_range:
  - -1.0
  - 5.0
  roi_slope_range:
  - -1.0
  - 1.0
  rank_slope_range:
  - -2.0
  - 2.0
  drawdown_max_pct: 50.0
  stability_window: 4
  trend_window: 7
  backfill_candidates_per_cycle: 10
  backfill_concurrency: 2
  trade_backfill_max_pages: 50
  pnl_backfill_max_pages: 10
  leaderboard_windows:
  - 1
  - 3
  - 7
  - 30
  sizing_multiplier_min: 0.75
  sizing_multiplier_max: 1.25
  sizing_multiplier_exponent: 1.0
  base_score_weight: 0.7
  longitudinal_score_weight: 0.3
hysteresis:
  promote_score: 0.55
  demote_score: 0.5
  min_tenure_cycles: 3
  min_dwell_seconds: 10800
scheduler:
  enabled: false
  rediscover_seconds: 1800
  rescore_seconds: 900
  evaluation_concurrency: 2
  max_evaluation_error_ratio: 0.25
  max_active_leaders: 3
  start_from_roster: true
  startup_wait_timeout_seconds: 3900
falcon:
  enabled: false
  # Bounds one full leaderboard sweep. The `--auto-trader` startup burst
  # re-checks the persisted accepted roster first and only sweeps when the
  # database is empty or that re-check produces nothing.
  candidate_limit: 50
  candidate_concurrency: 12
  wallet360_windows:
  - 1
  - 3
  - 7
  - 15
  required_wallet360_windows: 3
  max_wallet360_snapshot_age_hours: 72
  recent_trade_lookback_hours: 48
  max_last_trade_age_hours: 36
  activity_window_hours: 24
  min_activity_window_trades: 1
  min_recent_trades: 10
  max_recent_trades: 500
  max_recent_markets_per_wallet: 30
  max_depth_probes_per_wallet: 8
  max_price_jump_probes_per_wallet: 3
  price_jump_lookback_hours: 24
  price_jump_min_change_pct: '10'
  max_recent_price_jumps: 8
  enable_price_jump_risk: true
  short_market_max_days: 30
  min_short_trade_count: 0
  min_short_trade_share: '0'
  min_h_score: '60'
  min_liquidity_percentile: '50'
  toxic_market_flags:
  - liquidity_risk
  - volume_collapse
  - whale_control
  max_toxic_market_share: '0.50'
  max_market_concentration: '0.65'
  max_missing_field_ratio: '0.25'
  drawdown_gate_enabled: false
  max_drawdown: '0.35'
  max_sybil_score: '20'
  reject_perfect_timing_flag: true
  reject_suspicious_win_rate_flag: true
  max_similar_wallets: 2
  max_trades_per_day: '300'
  min_avg_trade_size_usdc: '5'
  excluded_categories:
  - Crypto
  max_excluded_category_trade_share: '0.50'
  specialist_bonus_enabled: true
  specialist_min_dominant_share: '0.80'
  specialist_min_win_rate: '0.57'
  specialist_bonus_weight: '0.10'
  leaderboard_min_win_rate_15d: '0.45'
  leaderboard_max_win_rate_15d: '0.95'
  leaderboard_min_roi_15d: '0'
  leaderboard_min_trades_15d: 15
  leaderboard_max_trades_15d: 3000
  leaderboard_min_pnl_15d: '0'
  leaderboard_sort_modes:
  - h_score
  - roi
  - win_rate
  - pnl
  - sharpe
  - trades
  bankroll:
    reserve_fraction: '0.20'
    max_positions: 12
    max_position_fraction: '0.10'
    target_trade_fraction: '0.08'
    min_order_usdc: '1'
    min_practical_copy_ratio: '0.001'
    max_copy_ratio: '1'
    min_copyable_trade_share: '0.35'
    min_fit_score: '0.45'
    visible_capacity_utilization: '1'
