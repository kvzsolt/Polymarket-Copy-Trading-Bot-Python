copy_tasks:
  enabled: true
  workers:
    enabled: true
    queue_size: 64
    global_concurrency: 4
    max_leader_workers: 64
    shutdown_timeout_seconds: 30.0
  shared_price_cache:
    enabled: true
    max_entries: 5000
    max_age_seconds: 2.0
  task_budget:
    enabled: true
    reservation_ttl_seconds: 120
    sweep_interval_seconds: 30.0
  reentry_lock:
    enabled: true
    unlock_on_market_resolution: true
    manual_unlock_enabled: true
  protective_exits:
    enabled: true
    require_authoritative_fill_for_lock: true