# Copy-task v1 engine. `enabled: false` is the paper-safe shipped default —
# the v1 runtime (leader workers, durable task budgets, reentry locks) starts
# only when an operator explicitly opts in here. The nested safety features
# stay `true` so opting in cannot silently shed a protection.
copy_tasks:
  enabled: false
  workers:
    enabled: true
    queue_size: 64
    global_concurrency: 4
    max_leader_workers: 64
    shutdown_timeout_seconds: 30.0
  shared_price_cache:
    enabled: true
    max_entries: 5000
    max_age_seconds: 2.0
  task_budget:
    enabled: true
    reservation_ttl_seconds: 120
    sweep_interval_seconds: 30.0
  reentry_lock:
    enabled: true
    unlock_on_market_resolution: true
    manual_unlock_enabled: true
  protective_exits:
    enabled: true
    require_authoritative_fill_for_lock: true