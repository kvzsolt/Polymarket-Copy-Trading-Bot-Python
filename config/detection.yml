# Configuration guide — grouped native owner evidence in Finland.
# Options: native.traders mode mined|pending, provider alchemy|infura, exhaustion
# mined|pause; pending_enabled defaults false; state/recovery bounds are explicit.
# Trade-offs: bounded mined logs reduce provider load; missed data is recovered
# as evidence only, and new roster members require a restart before activation.
# Finland production uses grouped native-owner mined logs only. No REST trade
# monitor, provisional-copy source, broad exchange log feed, or newHeads feed starts.
# Legacy fields below remain parse-compatible for offline compatibility tooling;
# detection.mode/onchain do not select the production entry source.
# RPC/WSS secrets are resolved only inside the approved shared ProviderRuntime.
# Native owner settings and roster additions apply after restart. Pending is a
# read-only observation feature and remains unavailable until its evaluator is wired.
# Position/inventory/risk reads are separate from leader trade detection.
fetch_interval: 0.5
aggregate_signal_window_seconds: 1
leader_positions_min_fetch_spacing_ms: 250
leader_activity_min_fetch_spacing_ms: 250
trade_queue_max_batches: 64
onchain:
  enable_onchain_pending_detection: false
  enable_onchain_mined_detection: false
  confirmed_source: mempool_reserved
  onchain_ws_url: ''
  pending_tx_ws_url: ''
  pending_tx_hashes_only: false
  pending_tx_max_signal_age_ms: 500
  pending_tx_detection_confidence_required: pending_probable
  pending_copy_confirmation_enabled: false
  pending_copy_confirmation_deadline_seconds: 60.0
  pending_copy_confirmation_max_tracked: 2048
  pending_copy_auto_unwind_enabled: false
native:
  state_path: data/native_detection.sqlite3
  traders: []
  pending_enabled: false
  maximum_inclusions: 1000000
  recovery_maximum_gap: 5000
  recovery_overlap: 8
