# Leader-signal detection cadence and on-chain detection.
# mode selects the on-chain detection source: polling | on_chain_pending |
# on_chain_confirmed. The checked-in base stays "polling"; select an on-chain
# mode per environment (config/environments/<env>/detection.yml) or via
# PMCOPY__DETECTION__MODE. REST polling keeps running as a parallel fallback
# in every mode. The onchain.enable_onchain_* booleans are deprecated.
# onchain.enable_onchain_pending_detection stays false by default:
# pending/mempool signals are provisional and must be an explicit opt-in.
# mode is deliberately NOT pinned here: the typed default is "polling", and an
# explicit base value would shadow the deprecated-boolean derivation for every
# deployment (a legacy enable_onchain_* true in a higher layer derives
# on_chain_confirmed with a deprecation warning).
fetch_interval: 0.5
aggregate_signal_window_seconds: 1
leader_positions_min_fetch_spacing_ms: 250
leader_activity_min_fetch_spacing_ms: 250
trade_queue_max_batches: 64
onchain:
  enable_onchain_pending_detection: false
  enable_onchain_mined_detection: false
  # on_chain_confirmed variant: mempool_reserved (default) = gen-2
  # Alchemy mempool-observed runtime; logs_only = mined OrderFilled
  # subscriptions topic-filtered on the followed leaders, on any wss://
  # provider. Inert in polling and on_chain_pending.
  confirmed_source: mempool_reserved
  onchain_ws_url: ''
  pending_tx_ws_url: ''
  pending_tx_hashes_only: false
  pending_tx_max_signal_age_ms: 500
  pending_tx_detection_confidence_required: pending_probable
  # Pending-copy confirmation (mode: on_chain_pending only). A copy executed
  # off a provisional mempool sighting is tracked until its receipt proves the
  # leader tx mined; a sighting that reverts, is replaced, or never mines
  # would otherwise leave an orphan position nothing detects.
  pending_copy_confirmation_enabled: true
  pending_copy_confirmation_deadline_seconds: 60.0
  pending_copy_confirmation_max_tracked: 2048
  # pending_copy_auto_unwind_enabled is accepted but inert — no unwind
  # requester is wired, so setting it true changes nothing and cannot move
  # money. Unwinding an orphan position stays a manual operator procedure
  # (see docs/known_limitations.md).
  pending_copy_auto_unwind_enabled: false
