# Configuration guide — live operator API activation.
# Purpose: override only control_plane.enabled; host/auth/limits inherit the
# safer base config/control_plane.yml values.
# Options: enabled is true | false.
# Trade-offs: false exposes no operator API; true enables commands/telemetry and
# requires the secret bearer credential under the inherited authentication policy.
# Operator API target is 127.0.0.1:9103. The bearer credential is supplied via
# secrets.env (see docs/live_runbook.md); transport policy stays in
# config/control_plane.yml.
enabled: false
