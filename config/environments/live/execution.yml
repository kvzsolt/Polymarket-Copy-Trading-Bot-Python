# Live environment override (selected with PMCOPY_ENVIRONMENT=live).
# Migrated from the operator's untracked config/runtime.local.yml.
# trading_mode remains the single authoritative live/paper selector.
trading_mode: live
# Live profile: reservations on (double-spend protection); every discretionary
# entry gate off. Copied FAK entries derive one tolerance-bounded limit from
# the leader fill and do not consume book spread/depth data.
reservations_enabled: true
enable_copy_decision_gate: false
enable_near_resolution_gate: false
max_book_spread_bps: 0
min_book_depth_usdc: 0
max_entry_price_drift_pct: 5.0
kill_switch: false
