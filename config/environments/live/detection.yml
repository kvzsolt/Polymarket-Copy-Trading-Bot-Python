# Live detection source. Base config/detection.yml stays mode: polling.
# on_chain_confirmed + confirmed_source: logs_only = copy on the mined
# OrderFilled event itself, delivered by a plain eth_subscribe "logs"
# subscription filtered on the OrderFilled topic0 and the followed leader
# wallets (gen-1 OnchainDetectionRuntime, mined subscriptions only). Detection
# lands at block inclusion (~2 s Polygon blocks), behind the mempool by
# roughly 0.7 s median (docs/audit/pending_detection_notes.md), but a mined
# fill is authoritative: no orphan-position risk and no pending-copy
# confirmation to run. A handful of filtered events per hour sits inside the
# provider free tiers (Alchemy 30M CU/month, Infura 3M credits/day), so the
# mempool path is no longer a cost decision away — flip
# PMCOPY__DETECTION__MODE=on_chain_pending to go back to it.
#
# REST polling keeps running as a parallel fallback in this mode exactly as in
# every other one; the copy layer dedups the same fill by trade key
# (CrossSourceTradeClaimPolicy), so a fill is copied once no matter which
# source saw it first.
#
# The pending_* keys below are inert in this mode (kept for the mempool
# fallback) and pending_tx_provider stays alchemy — the operator's WSS is
# Alchemy, and logs_only also accepts any generic eth_subscribe endpoint.
mode: on_chain_confirmed
onchain:
  confirmed_source: logs_only
  pending_tx_provider: alchemy
  # Wider than the 500 ms base budget: a mempool sighting is only useful while
  # it is still unmined, and 700 ms keeps the queue-age gate above the measured
  # median lead instead of discarding usable signals under a load spike.
  pending_tx_max_signal_age_ms: 700
  # A mempool sighting never reaches better than pending_probable; a higher
  # floor would drop 100 % of signals in this mode.
  pending_tx_detection_confidence_required: pending_probable
  pending_copy_confirmation_enabled: true
  pending_copy_confirmation_deadline_seconds: 60
  pending_copy_confirmation_max_tracked: 2048
