# Configuration guide — live discovery overrides.
# Purpose: use the explicit trader-file roster by default while retaining a
# bounded one-process --auto-trader sweep configuration.
# Options: scheduler.enabled/falcon.enabled are true | false; candidate_limit is
# a positive wallet count.
# Trade-offs: disabled is deterministic and free of provider dependency; enabled
# adapts the roster but adds API cost, latency, and scoring/model risk.
# Live profile: the leader roster comes from config/traders/<fantasy-name>.yml.
# Discovery policy is identical to paper (operator decision 2026-10-11): the
# scheduler override was removed so live discovery equals the paper profile.
falcon:
  # No normal Falcon evaluation without explicit process override.
  enabled: false
  # One `--auto-trader` sweep costs several provider calls per shortlisted
  # wallet, so the sweep is bounded at 50. The startup burst re-checks the
  # persisted roster first and only sweeps when that yields nothing.
  candidate_limit: 50
