# Configuration guide — one followed leader and its v1 copy-task strategy.
# Purpose: keep wallet identity, enablement, optional admission overrides, and
# the complete per-leader reaction/filter/sizing policy in one auditable file.
# Options:
# - name is a short file/task slug; wallet is a 42-character 0x address; enabled
#   pauses/resumes the leader without deleting history.
# - optional copy_decision_min_score [0,1], copy_max_price_drift_pct,
#   copy_max_edge_decay_pct, copy_max_signal_age_seconds,
#   copy_liquidity_target_usdc, and max_entry_price_drift_pct override global
#   copy_trading/execution values; omission inherits the global setting.
# - monitoring_mode is normal | priority; notifications_muted is true | false.
# - sizing_mode and sizing.mode must agree: fixed | exact_mirror | proportional |
#   balance_weighted | portfolio_weighted | adaptive | tiered.
# - trigger limits source notional; 0 disables each min/max bound.
# - spend caps lifetime/daily/per-market USDC; 0 disables a cap. one_entry flags
#   restrict duplicates per task, globally, or sports type.
# - price band is [0,1]; offset_mode is disabled | fixed | percentage;
#   offset_direction is above | below; max_slippage_percent is non-negative.
# - reaction selects BUY/SELL behavior; copy_side is both | yes_only | no_only.
#   buy_on_sells/counter_trade invert intent and are high-risk; merge/split/
#   conversion switches opt into those source activity types.
# - market_filter lists are allow/deny selectors; numeric liquidity/volume/close
#   limits use 0 to disable; allow_expired_unresolved is true | false.
# - schedule false means always open; true uses an IANA timezone and HH:MM
#   start/end (start later than end means overnight).
# - sizing percentage/fixed amount/multipliers and min/max bounds are pUSD BUY
#   controls; proportional balance caps need leader balance; strict fixed/exact
#   modes reject when the requested amount cannot fit instead of clamping.
# Trade-offs: stricter filters, lower caps, and strict sizing reduce exposure but
# skip more leader actions; priority/larger sizing follows faster/more closely at
# higher bankroll and I/O pressure. Inverted reactions and expired markets carry
# materially higher semantic, liquidity, and settlement risk.
#
# Followed trader: alpha-steady.
#
# This file is the SINGLE source of truth for following this wallet.
# Everything about how the bot follows this trader lives here:
#   - wallet: the leader address to watch
#   - enabled: false pauses this leader without deleting the file
#   - copy gates: per-leader admission thresholds (optional, inherit
#     copy_trading.yml when omitted)
#   - task: the complete v1 copy-task strategy for this leader (trigger,
#     spend, price, reaction, market_filter, schedule, sizing)
#
# The file name is the trader's fantasy name. It is also the default task id
# used when the v1 copy-task engine seeds file-defined tasks into the DB.
# The task below only runs when copy_trading.copy_tasks.enabled is true in
# config/copy_trading.yml (or the selected environment override).

name: alpha-steady
wallet: "0xc4ac7dee4d55d1698e88a8160d5c61ede96b9722"
enabled: false

# Per-leader copy-admission gates. Omitted values inherit from
# config/copy_trading.yml. max_entry_price_drift_pct is the one-shot FAK
# band for this leader; widen it only if this trader sweeps the book so hard
# that the venue kills copies with "no orders found to match with FAK order".
# max_entry_price_drift_pct: 5.0

# Complete copy-task strategy for following this leader.
task:
  monitoring_mode: normal          # normal | priority
  sizing_mode: proportional        # fixed | exact_mirror | proportional | balance_weighted | portfolio_weighted | adaptive | tiered
  notifications_muted: false

  trigger:
    enabled: true
    min_notional: 0                # copy only source trades >= this USDC size (0 = disabled)
    max_notional: 0                # copy only source trades <= this USDC size (0 = disabled)

  spend:
    enabled: true
    max_total: 0                   # lifetime USDC cap for this task (0 = disabled)
    max_daily: 0                   # daily USDC cap for this task (0 = disabled)
    max_per_market: 0              # per-market USDC cap for this task (0 = disabled)
    one_entry_per_market: false    # at most one entry per market for this task
    global_one_entry_per_market: false
    one_entry_per_sports_type: false

  price:
    enabled: true
    min_price: 0.20                # copy BUYs only when leader price is >= this
    max_price: 0.80                # copy BUYs only when leader price is <= this
    offset_mode: disabled          # disabled | fixed | percentage
    offset_direction: above        # above | below
    offset: 0
    max_slippage_percent: 5        # explicit execution protection

  reaction:
    enabled: true
    follow_buys: true
    copy_sells: true
    buy_on_sells: false            # invert leader SELLs into BUYs (dangerous)
    counter_trade: false
    copy_side: both                # both | yes_only | no_only
    copy_merges: false
    copy_splits: false
    copy_conversions: false

  market_filter:
    enabled: true
    include_keywords: []
    exclude_keywords: []
    categories: []
    tokens: []
    timeframes: []
    min_liquidity_usdc: 0          # 0 = disabled
    min_volume_24h_usdc: 0         # 0 = disabled
    max_days_until_close: 0        # 0 = disabled
    allow_expired_unresolved: false

  schedule:
    enabled: false                 # false = always open
    timezone_name: UTC             # IANA timezone
    start: "00:00"                 # HH:MM; start > end means overnight
    end: "00:00"

  sizing:
    enabled: true
    mode: proportional             # fixed | exact_mirror | proportional | balance_weighted | portfolio_weighted | adaptive | tiered
    percentage: 5                  # % of leader trade size when mode is proportional
    fixed_amount: 3                # USDC when mode is fixed
    trade_multiplier: 1
    weighted_multiplier: 1
    buy_min_amount: 5
    buy_max_amount: 17.5           # 5 % of the 350 pUSD bankroll profile
    copyable_balance_percent: 75
    proportional_balance_cap_enabled: true
    require_leader_balance: true
    strict_fixed_amount: true
    strict_exact_mirror: true
