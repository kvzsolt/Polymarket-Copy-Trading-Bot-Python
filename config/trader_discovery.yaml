# Single source of truth for trader discovery, ranking, and roster hysteresis.
# No formula constants live in Python; tune this file or PMCOPY__DISCOVERY__...
# overrides. Agent 569 PnL is realized-only.

discovery:
  api:
    base_url: https://narrative.agent.heisenberg.so/api/v2/semantic/retrieve/parameterized
    token: ""
    timeout_seconds: 20.0
    max_retries: 6
    requests_per_second: 1.0
    burst: 1.0
    max_connections: 32
    max_keepalive_connections: 16
    keepalive_expiry_seconds: 30.0
    retry_base_delay_seconds: 1.0
    retry_max_delay_seconds: 30.0
    retry_jitter_ratio: 0.50

  shortlist:
    min_win_rate_15d: 0.45
    max_win_rate_15d: 0.92
    min_roi_15d: 0.0
    min_pnl_15d: 100.0
    min_total_trades_15d: 30
    max_total_trades_15d: 5000
    sort_modes: [h_score, roi, win_rate, pnl]
    page_size: 100
    max_pages: 5
    candidate_pool_size: 250

  wallet360:
    windows: ["1", "3", "7", "15"]
    max_drawdown_pct: 35.0
    min_market_diversity: 3
    reject_bot_flagged: true
    max_stake_cv: 3.2
    min_win_rate_consistency: 0.60

  recency:
    max_hours_since_last_trade: 48
    min_trades_lookback: 3
    lookback_hours: 168
    page_size: 100
    max_pages: 5

  market:
    min_volume_24h: 5000.0
    min_liquidity_percentile: 40.0
    volume_trend: ALL
    max_top1_wallet_pct: 60.0
    min_unique_traders_7d: 25
    min_pass_ratio: 0.60
    max_markets_per_candidate: 8

  social:
    enabled: false
    keywords: []
    hours_back: 24
    min_acceleration: 1.0
    min_author_diversity_pct: 20.0

  scoring:
    weights:
      falcon_quality: 0.30
      copyability: 0.25
      recent_consistency: 0.15
      market_quality: 0.10
      volume_fit: 0.10
      rank_quality: 0.05
      risk_inverse: 0.05
    quality_weights:
      h_score: 0.50
      roi: 0.20
      win_rate: 0.15
      sharpe: 0.10
      baseline: 0.05
    # Low-latency trade decisions blend the persisted roster rank with fresh
    # local evidence. This replaces the independent legacy leader formula.
    runtime_weights:
      roster_score: 0.70
      win_rate: 0.15
      pnl: 0.10
      activity: 0.05
    h_score_range: [0.0, 100.0]
    roi_15d_range: [-50.0, 200.0]
    win_rate_15d_range: [0.35, 0.75]
    sharpe_15d_range: [-1.0, 5.0]
    volume_target_15d: 50000.0
    rank_target: 100
    copyability_trade_target: 50
    risk_drawdown_max_pct: 100.0
    runtime_default_roster_score: 0.50
    runtime_pnl_target_usdc: 100.0
    runtime_activity_target: 8
    runtime_score_floor: 0.10

  longitudinal:
    enabled: true
    half_life_days: 7.0
    prior_score: 0.50
    shrinkage_trade_count: 30
    history_days: 90
    pnl_backfill_days: 180
    weights:
      sharpe: 0.30
      roi_slope: 0.20
      win_rate_stability: 0.20
      rank_trajectory: 0.15
      drawdown: 0.15
    sharpe_range: [-1.0, 5.0]
    roi_slope_range: [-1.0, 1.0]
    rank_slope_range: [-2.0, 2.0]
    drawdown_max_pct: 50.0
    stability_window: 4
    trend_window: 7
    backfill_candidates_per_cycle: 10
    backfill_concurrency: 2
    trade_backfill_max_pages: 50
    pnl_backfill_max_pages: 10
    leaderboard_windows: [1, 3, 7, 30]
    sizing_multiplier_min: 0.75
    sizing_multiplier_max: 1.25
    sizing_multiplier_exponent: 1.0
    base_score_weight: 0.70
    longitudinal_score_weight: 0.30

  hysteresis:
    promote_score: 0.62
    demote_score: 0.50
    min_tenure_cycles: 3
    min_dwell_seconds: 10800

  scheduler:
    enabled: true
    rediscover_seconds: 1800
    rescore_seconds: 900
    evaluation_concurrency: 2
    # Fail the cycle instead of mass-demoting the roster when an upstream
    # agent outage turns too many candidate evaluations into errors.
    max_evaluation_error_ratio: 0.25
    max_active_leaders: 2
    start_from_roster: true
    # Discovery-only startup remains observable and fails instead of waiting
    # forever when no candidate can complete the promotion tenure.
    startup_wait_timeout_seconds: 3900
